    <meta charset="utf-8" />

    <title>Naveen | UI/UX Designer &amp; Engineer</title>

    <script>
      // Set the saved theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') {
          document.documentElement.setAttribute('data-theme', t);
        }
      } catch (e) {}
    </script>
  </head>

    <div id="root"></div>
